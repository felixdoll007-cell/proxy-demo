services:
  backend:
    image: nginx:alpine
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - frontend-net
      - backend-net

  db:
    image: redis:alpine
    volumes:
      - redisdaten:/data
    networks:
      - backend-net

  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend-net
    depends_on:
      - backend

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge


volumes: 
  redisdaten: 
